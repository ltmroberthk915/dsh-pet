name: Stage npm release
# Deliberately manual: a Git tag is not proof of a successful npm publication.
# Publish next first. Use release-channel.mjs promote only after the cooldown
# and a strict official-registry install receipt from the real DSH runtime.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Reviewed existing vX.Y.Z tag'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Validate tag and publish credentials
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1); if (!process.env.NODE_AUTH_TOKEN) throw Error("NPM_TOKEN is required for dsh-pet-copilot")'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/test-release-channel.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/build-desktop-manifest.mjs
      - name: Compose migration with real DSH app-boot
        run: |
          npm install --prefix output/host-fixture --ignore-scripts @deepseek-ai/dsh-app-boot@0.2.0-rc.2 @deepseek-ai/dsh-atomic-write@0.2.0-rc.2 yaml@2.9.1
          node scripts/test-profile-migration.mjs output/host-fixture
      - run: node scripts/package-companions.mjs
      - name: Publish verified archive to next and verify official npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/stage-release.mjs "output/dsh-pet-copilot-$(node -p 'require("./package.json").version').tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-publication-receipt
          path: output/npm-publication.json
